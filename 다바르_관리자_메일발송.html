<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다바르 관리자 메일 발송</title>
  <style>
    body{max-width:620px;margin:48px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#24211d;background:#f3efe6;line-height:1.6}
    h1{font-size:1.6rem;font-weight:600}label{display:block;margin:18px 0 6px;font-weight:600}
    input,textarea{width:100%;padding:11px;border:1px solid #c9c0ae;background:#fffdf8;box-sizing:border-box;font:inherit}
    textarea{min-height:130px;resize:vertical}button{margin-top:22px;padding:11px 20px;border:0;background:#211f1b;color:#fff;cursor:pointer}
    #status{margin-top:18px;color:#3b5a6b}
  </style>
</head>
<body>
  <h1>다바르 관리자 메일 발송</h1>
  <p>응답자에게 보낼 파일과 내용을 입력하세요. 응답 목록은 이 페이지에 표시되지 않습니다.</p>
  <form id="sendForm">
    <label for="token">관리자 토큰</label>
    <input id="token" type="password" required>
    <label for="subject">메일 제목</label>
    <input id="subject" required>
    <label for="message">메일 내용</label>
    <textarea id="message" required></textarea>
    <label for="file">첨부 파일</label>
    <input id="file" type="file" required>
    <button type="submit">응답자에게 발송</button>
  </form>
  <div id="status" role="status"></div>
  <script>
    const SEND_ENDPOINT = 'https://script.google.com/macros/s/AKfycbza4M11DmceSebBZjeQCCnyQqYzpHZrkuzRSPEMWP0p4ltskIUuXHPzKqY7VNaiIJGk/exec';
    const sendForm = document.getElementById('sendForm');
    const status = document.getElementById('status');

    sendForm.addEventListener('submit', async event => {
      event.preventDefault();
      const file = document.getElementById('file').files[0];
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = String(reader.result).split(',')[1];
        const response = await fetch(SEND_ENDPOINT, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({
            action:'send', token:document.getElementById('token').value,
            subject:document.getElementById('subject').value,
            message:document.getElementById('message').value,
            fileName:file.name, mimeType:file.type, fileData:base64
          })
        });
        const result = await response.json();
        status.textContent = result.ok ? result.sent + '명에게 발송했습니다.' : '발송에 실패했습니다.';
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
